# Geography for Phase 1 (Davis County, Utah).
#
# state   = peer group for scores (Phase 1 peer set is the Davis County cities below;
#           all-Utah ranking arrives in Phase 2).
# county  = the primary area.
# places  = the 15 incorporated cities in Davis County, with their 7-digit place GEOID
#           and overlap_share (the fraction of the city that lies inside Davis County).
#
# PHASE 1 SIMPLIFICATION: this list is curated and verified against the ACS place list
# (2026-10-16). All 15 Davis County cities lie wholly within the county, so overlap_share
# is 1.0 for each. Phase 2 replaces this with a crosswalk derived from an authoritative
# Census relationship file so cities that cross county lines get a fractional share.

